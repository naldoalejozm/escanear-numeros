<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escanear Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Una columna centrada: entrada arriba, lista editable, acción de guardar al final */
  :root {
    --bg: #f2f5f4; --surface: #ffffff; --fg: #17211f; --muted: #5d6b68;
    --line: #d5dedb; --accent: #0f7a5c; --accent-fg: #ffffff; --accent-soft: #dcefe8;
    --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101615; --surface: #18201f; --fg: #e6eeec; --muted: #93a39f;
      --line: #2b3735; --accent: #3fbf96; --accent-fg: #06231a; --accent-soft: #173a30;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101615; --surface: #18201f; --fg: #e6eeec; --muted: #93a39f;
    --line: #2b3735; --accent: #3fbf96; --accent-fg: #06231a; --accent-soft: #173a30;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 1.6rem; font-weight: 800; margin: 8px 0 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; line-height: 1.5; }

  .drop {
    display: grid; place-items: center; gap: 6px; text-align: center;
    padding: 28px 16px; border: 2px dashed var(--line); border-radius: 14px;
    background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { font-size: 1.1rem; }
  .drop span { color: var(--muted); font-size: .9rem; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .status { min-height: 1.4em; color: var(--muted); font-size: .95rem; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .head label { font-weight: 700; }
  .count { font-family: var(--font-num); color: var(--accent); font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 260px; resize: vertical; padding: 12px;
    font-family: var(--font-num); font-size: 1.05rem; line-height: 1.6;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; border-radius: 10px; padding: 14px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  button.primary { flex: 1; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Escanear números de celular</h1>
    <p class="sub">Sube capturas o fotos, revisa los números y descarga el Excel. Todo se procesa en tu aparato.</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="archivo" accept="image/*" multiple>
    <strong>Elegir imágenes o tomar foto</strong>
    <span>También puedes arrastrarlas aquí o pegar con Ctrl+V</span>
  </label>

  <div>
    <div class="status" id="estado">Listo.</div>
    <div class="bar" hidden id="barra"><i id="progreso"></i></div>
  </div>

  <div class="head">
    <label for="lista">Números detectados</label>
    <span class="count" id="contador">0</span>
  </div>
  <textarea id="lista" placeholder="Aquí aparecerán los números, uno por línea. Puedes corregirlos."></textarea>
  <label class="check"><input type="checkbox" id="dupes" checked> Quitar números duplicados</label>

  <div class="actions">
    <button class="primary" id="guardar">Descargar Excel</button>
    <button id="limpiar">Limpiar</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const MIN_DIGITOS = 7, MAX_DIGITOS = 15, CODIGO_PAIS = "51";
const PATRON = /\+?\(?\d[\d\s\-.()]{5,}\d/g;
const CORRECCIONES = { O: "0", o: "0", D: "0", l: "1", I: "1", "|": "1", S: "5", B: "8" };

const $ = id => document.getElementById(id);
const lista = $("lista"), estado = $("estado"), barra = $("barra"), progreso = $("progreso");
let workerPromesa = null;

function obtenerWorker() {
  if (!workerPromesa) {
    workerPromesa = Tesseract.createWorker("eng", 1, {
      logger: m => { if (m.status === "recognizing text") progreso.style.width = (m.progress * 100) + "%"; }
    });
  }
  return workerPromesa;
}

function extraerNumeros(texto) {
  const numeros = [];
  for (let linea of texto.split("\n")) {
    const digitos = (linea.match(/\d/g) || []).length;
    const largo = linea.replace(/\s/g, "").length || 1;
    if (digitos >= MIN_DIGITOS - 1 && digitos / largo > 0.6) {
      linea = linea.replace(/[OoDlI|SB]/g, c => CORRECCIONES[c]);
    }
    for (const m of linea.matchAll(PATRON)) {
      let d = m[0].replace(/\D/g, "");
      if (d.length === 11 && d.startsWith(CODIGO_PAIS)) d = d.slice(CODIGO_PAIS.length);
      if (d.length >= MIN_DIGITOS && d.length <= MAX_DIGITOS) numeros.push(d);
    }
  }
  return numeros;
}

// Agranda imágenes pequeñas: Tesseract lee mejor el texto grande
function prepararImagen(file) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => {
      const escala = img.width < 1200 ? 2 : 1;
      const c = document.createElement("canvas");
      c.width = img.width * escala; c.height = img.height * escala;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c);
    };
    img.onerror = () => mal(new Error("No es una imagen válida"));
    img.src = URL.createObjectURL(file);
  });
}

function numerosActuales() {
  return lista.value.split("\n").map(s => s.trim()).filter(Boolean);
}
function actualizarContador() {
  $("contador").textContent = numerosActuales().length;
}

async function procesar(files) {
  files = [...files].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  barra.hidden = false;
  const encontrados = [];
  try {
    estado.textContent = "Preparando el lector (la primera vez tarda un poco)...";
    const worker = await obtenerWorker();
    for (let i = 0; i < files.length; i++) {
      estado.textContent = `Leyendo imagen ${i + 1} de ${files.length}...`;
      progreso.style.width = "0";
      try {
        const { data } = await worker.recognize(await prepararImagen(files[i]));
        encontrados.push(...extraerNumeros(data.text));
      } catch (e) {
        estado.textContent = `No se pudo leer "${files[i].name}": ${e.message}`;
      }
    }
  } catch (e) {
    estado.textContent = "No se pudo cargar el lector. Revisa tu conexión a internet y vuelve a intentar.";
    workerPromesa = null;
    barra.hidden = true;
    return;
  }
  agregar(encontrados);
  barra.hidden = true;
}

function agregar(nuevos) {
  const existentes = numerosActuales();
  if ($("dupes").checked) {
    const vistos = new Set(existentes);
    nuevos = nuevos.filter(n => !vistos.has(n) && vistos.add(n));
  }
  lista.value = [...existentes, ...nuevos].join("\n");
  actualizarContador();
  estado.textContent = `Se agregaron ${nuevos.length} número(s). Total: ${numerosActuales().length}.`;
}

$("archivo").addEventListener("change", e => { procesar(e.target.files); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); procesar(e.dataTransfer.files); });
document.addEventListener("paste", e => {
  const imgs = [...e.clipboardData.items].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile());
  if (imgs.length) { e.preventDefault(); procesar(imgs); }
});
lista.addEventListener("input", actualizarContador);

$("limpiar").addEventListener("click", () => { lista.value = ""; actualizarContador(); estado.textContent = "Lista vacía."; });

$("guardar").addEventListener("click", () => {
  let numeros = numerosActuales();
  if ($("dupes").checked) numeros = [...new Set(numeros)];
  if (!numeros.length) { estado.textContent = "No hay números para guardar."; return; }
  // los números van como texto para no perder ceros iniciales
  const filas = [["N°", "Celular"], ...numeros.map((n, i) => [i + 1, { t: "s", v: n }])];
  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws["!cols"] = [{ wch: 6 }, { wch: 22 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Números");
  const f = new Date(), p = n => String(n).padStart(2, "0");
  XLSX.writeFile(wb, `numeros_${f.getFullYear()}-${p(f.getMonth() + 1)}-${p(f.getDate())}_${p(f.getHours())}${p(f.getMinutes())}.xlsx`);
  estado.textContent = `Excel descargado con ${numeros.length} números.`;
});
</script>
</body>
</html>
